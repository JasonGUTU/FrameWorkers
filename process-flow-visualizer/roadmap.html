<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frameworkers — Roadmap</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .rm-back {
      display: inline-block;
      margin-bottom: 18px;
      color: #7eb3ff;
      text-decoration: none;
      font-size: 0.9em;
    }
    .rm-back:hover { text-decoration: underline; }
    .rm-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .rm-item {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid #4f8ef7;
      border-radius: 8px;
      padding: 16px 20px;
    }
    .rm-index {
      font-size: 1.8em;
      font-weight: 700;
      color: rgba(255,255,255,0.18);
      line-height: 1;
      min-width: 38px;
      padding-top: 2px;
    }
    .rm-title {
      font-weight: 600;
      color: #e6e6e6;
      margin-bottom: 8px;
      font-size: 1.02em;
    }
    .rm-ul {
      margin: 0;
      padding-left: 18px;
      color: #aaa;
      font-size: 0.9em;
      line-height: 1.75;
    }
    .rm-note {
      margin-top: 10px;
      font-size: 0.82em;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="rm-back" href="./index.html">← 返回总览</a>
      <div class="logo-row">
        <img class="logo-mark" src="./logo.svg" alt="Frameworkers logo" />
        <div class="logo-text">
          <span class="logo-name">Frameworkers</span>
          <span class="logo-tagline">Roadmap</span>
        </div>
      </div>
      <div class="header-divider"></div>
      <div class="header-badge">🗺 Roadmap</div>
      <h1>Roadmap</h1>
      <p>下一阶段聚焦：测试体系搭建 + 训练数据构建。</p>
    </header>

    <section class="rm-list" id="rmList"></section>
  </main>

  <script>
    const ROADMAP = [
      { index: "01", title: "InputResolver 测试（已完成 ✓）" },
      { index: "02", title: "Assistant 测试（已完成 ✓）" },
      { index: "03", title: "继续调试 Director 直到结果满意（已完成 ✓）" },
      { index: "04", title: "构建 Director 训练集（已完成 ✓）" },
      { index: "05", title: "RL 训练 Director" },
      { index: "06", title: "Director × Assistant 联合测试代表性例子" },
      { index: "07", title: "解决声话不同步的问题（已完成 ✓）" },
      { index: "08", title: "梳理各个 Sub-Agent 之间的功能耦合（已完成 ✓）" },
      { index: "09", title: "Sub-Agent 有能力拒绝很差的输入（已完成 ✓）" },
      { index: "10", title: "集成 Director 与 Plan Stack（已完成 ✓）" },
      { index: "11", title: "跨 Agent 协作验证" },
    ];

    document.getElementById("rmList").innerHTML = ROADMAP.map(r => `
      <div class="rm-item">
        <div class="rm-index">${r.index}</div>
        <div style="flex:1">
          <div class="rm-title">${r.title}</div>
        </div>
      </div>
    `).join("");
  </script>
</body>
</html>
