<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>e2e_30 — selection review</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c2030;
    --border: #2a2f42;
    --fg: #e6e8ef;
    --muted: #8b91a8;
    --accent: #6aa9ff;
    --good: #28c76f;
    --warn: #ff9f43;
    --bad: #ea5455;
    --tag-bg: #232a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100%; font-size: 14px; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 16px; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .stats { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap;
    margin-left: auto; }
  .stats .num { color: var(--fg); font-weight: 600; }

  nav.cats { display: flex; gap: 0; padding: 0 18px; background: var(--panel);
    border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav.cats button { background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 10px 14px; color: var(--muted); white-space: nowrap; cursor: pointer;
    font-size: 13px; font-family: inherit; }
  nav.cats button.active { color: var(--fg); border-bottom-color: var(--accent); }
  nav.cats button:hover { background: var(--panel-2); }
  nav.cats button .count { font-size: 11px; opacity: 0.7; margin-left: 4px; }

  main { flex: 1; display: flex; min-height: 0; }
  aside.list { width: 320px; border-right: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; flex-shrink: 0; }
  .case-row { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .case-row:hover { background: var(--panel-2); }
  .case-row.active { background: var(--panel-2); border-left: 3px solid var(--accent);
    padding-left: 11px; }
  .case-row .name { font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--fg); font-weight: 600; }
  .case-row .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    color: var(--muted); font-size: 11px; }
  .case-row .preview { color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  section.detail { flex: 1; overflow-y: auto; padding: 24px 32px; min-width: 0; }
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    flex-wrap: wrap; }
  .detail-header .name { font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 20px; font-weight: 600; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; background: var(--tag-bg); color: var(--fg); white-space: nowrap; }
  .badge.cat-cr { background: #4a3060; color: #e0baff; }
  .badge.cat-intake_img { background: #2f4a30; color: #b6f0bb; }
  .badge.cat-storytelling { background: #4a3a1f; color: #ffd9a3; }
  .badge.genre { background: #1f3a4a; color: #a3d9ff; }
  .badge.layers { background: #3a3a3a; color: #ddd; font-family: ui-monospace, monospace; }

  h3.section-title { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 18px 0 8px; font-weight: 600; }

  .goal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; line-height: 1.65; white-space: pre-wrap; font-size: 14px; }

  .chain-box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 0; }
  .chain-layer { display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--border); }
  .chain-layer:last-child { border-bottom: none; }
  .chain-layer .idx { color: var(--muted); font-family: ui-monospace, monospace;
    font-size: 12px; min-width: 32px; }
  .chain-layer .agents { display: flex; gap: 6px; flex-wrap: wrap; }
  .chain-agent { padding: 3px 9px; border-radius: 4px; background: var(--tag-bg);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .chain-agent.parallel { background: #2a4a5a; }
  .chain-agent.done { background: var(--good); color: #0a1a0a; font-weight: 600; }
  .chain-layer .par-tag { color: var(--muted); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.5px; }

  .placeholder { background: var(--panel); border: 1px dashed var(--border); border-radius: 6px;
    padding: 24px; color: var(--muted); text-align: center; font-size: 13px;
    line-height: 1.6; }
  .placeholder strong { color: var(--fg); }

  .meta-grid { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px;
    font-size: 13px; }
  .meta-grid .k { color: var(--muted); }
  .meta-grid .v { font-family: ui-monospace, monospace; }

  .badge-rewritten { background: #4a2f60; color: #d9b6ff; }
  details.original-toggle { margin-top: 10px; }
  details.original-toggle > summary { cursor: pointer; color: var(--muted);
    font-size: 12px; padding: 4px 0; user-select: none; list-style: none; }
  details.original-toggle > summary::before { content: '▸ '; }
  details.original-toggle[open] > summary::before { content: '▾ '; }
  details.original-toggle > summary:hover { color: var(--accent); }
  .original-box { background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; line-height: 1.65;
    white-space: pre-wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .original-box .label { display: block; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; opacity: 0.7; }

  footer { padding: 8px 18px; border-top: 1px solid var(--border); background: var(--panel);
    color: var(--muted); font-size: 12px; }
  kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px; font-family: ui-monospace, monospace; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">e2e_30 — selection review (phase 1)</div>
      <div class="subtitle" id="subtitle">loading…</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="cats" id="cats"></nav>
  <main>
    <aside class="list" id="caseList"></aside>
    <section class="detail" id="detail"></section>
  </main>
  <footer>
    <kbd>j</kbd>/<kbd>↓</kbd> next case · <kbd>k</kbd>/<kbd>↑</kbd> prev case ·
    <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> switch tab (cr / intake_img / storytelling)
  </footer>
</div>

<script>
let DATA = [];
let RESULTS = {};
let CATEGORIES = ["cr", "intake_img", "storytelling"];
let currentCat = "cr";
let currentName = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function casesIn(cat) { return DATA.filter(c => c.category === cat); }

function renderHeader() {
  const total = DATA.length;
  const shapes = new Set(DATA.map(c => c._meta.shape_layers_str)).size;
  const genres = new Set(DATA.map(c => c._meta.sampled_genre)).size;
  document.getElementById("stats").innerHTML =
    `<span><span class="num">${total}</span> cases</span>` +
    `<span><span class="num">${shapes}</span> unique chain shapes</span>` +
    `<span><span class="num">${genres}</span> genres</span>` +
    `<span>seed=42</span>`;
  const rewritten = DATA.filter(c => c._meta.rewritten === true).length;
  document.getElementById("subtitle").textContent =
    `${total} cases sampled — cr/intake_img (${rewritten}) rewritten as Chinese 短剧爆款 for user study; ` +
    `storytelling 10 left as-is. Review here, then approve to run real e2e.`;
}

function renderCats() {
  const counts = Object.fromEntries(CATEGORIES.map(c => [c, casesIn(c).length]));
  document.getElementById("cats").innerHTML = CATEGORIES.map(cat => {
    const active = cat === currentCat ? "active" : "";
    return `<button class="${active}" onclick="switchCat('${cat}')">${cat}<span class="count">(${counts[cat]})</span></button>`;
  }).join("");
}

function renderList() {
  const items = casesIn(currentCat);
  document.getElementById("caseList").innerHTML = items.map(c => {
    const active = c.name === currentName ? "active" : "";
    const m = c._meta;
    const goalShort = c.user_goal.slice(0, 80) + (c.user_goal.length > 80 ? "…" : "");
    return `<div class="case-row ${active}" onclick="goTo('${c.name}')">
      <div class="name">${c.name}</div>
      <div class="meta">
        <span class="badge layers">${m.shape_layer_count}L</span>
        <span class="badge genre">${m.sampled_genre}</span>
      </div>
      <div class="preview">${escapeHtml(goalShort)}</div>
    </div>`;
  }).join("");
}

function renderDetail() {
  const c = DATA.find(x => x.name === currentName);
  if (!c) {
    document.getElementById("detail").innerHTML =
      '<div class="placeholder">Select a case from the left.</div>';
    return;
  }
  const m = c._meta;
  const cat = c.category;

  // Render chain layers
  const layersHtml = c.expected_chain.map((layer, i) => {
    const isParallel = layer.length > 1;
    const isDone = layer.length === 1 && layer[0] === "done";
    const agentsHtml = layer.map(a => {
      let cls = "chain-agent";
      if (isParallel) cls += " parallel";
      if (a === "done") cls += " done";
      return `<span class="${cls}">${escapeHtml(a)}</span>`;
    }).join("");
    const parTag = isParallel
      ? '<span class="par-tag">parallel</span>' : '';
    return `<div class="chain-layer">
      <span class="idx">${String(i + 1).padStart(2, "0")}</span>
      <div class="agents">${agentsHtml}</div>
      ${parTag}
    </div>`;
  }).join("");

  // Detect whether this case needs an upload image
  const goalLower = c.user_goal.toLowerCase();
  const needsUpload = /this (uploaded |attached )?(image|portrait|photo|sketch|painting|reference)/i
    .test(c.user_goal) || goalLower.includes("i've uploaded") || goalLower.includes("i uploaded")
    || goalLower.includes("here's a");

  const isRewritten = m.rewritten === true && m.original_user_goal;
  const originalBlock = isRewritten ? `
    <details class="original-toggle">
      <summary>查看 original user_goal（eval_cases v4500 原文）</summary>
      <div class="original-box">
        <span class="label">original (replaced for user study)</span>
        ${escapeHtml(m.original_user_goal)}
      </div>
    </details>` : '';

  document.getElementById("detail").innerHTML = `
    <div class="detail-header">
      <span class="name">${c.name}</span>
      <span class="badge cat-${cat}">${cat}</span>
      <span class="badge genre">${m.sampled_genre}</span>
      <span class="badge layers">${m.shape_layer_count} layers</span>
      ${isRewritten ? '<span class="badge badge-rewritten">已重写</span>' : ''}
      ${needsUpload ? '<span class="badge" style="background:#603030;color:#ffb0b0">needs upload</span>' : ''}
    </div>

    <h3 class="section-title">User goal${isRewritten ? '（rewritten 2026-05-09）' : ''}</h3>
    <div class="goal-box">${escapeHtml(c.user_goal)}</div>
    ${originalBlock}

    ${needsUpload ? `
    <h3 class="section-title">Mock upload image (gemini-3.1-flash-image-preview)</h3>
    <img src="./uploads/${c.name}.png"
         alt="upload preview for ${c.name}"
         onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>upload image not yet generated</div>'"
         style="max-height: 360px; max-width: 100%; border-radius: 6px;
                border: 1px solid var(--border); display: block;" />
    ` : ''}

    <h3 class="section-title">GT expected_chain (ground truth plan)</h3>
    <div class="chain-box">${layersHtml}</div>

    <h3 class="section-title">Sampling metadata</h3>
    <div class="meta-grid">
      <span class="k">shape_layers_str</span>
      <span class="v">${escapeHtml(m.shape_layers_str)}</span>
      <span class="k">shape_layer_count</span><span class="v">${m.shape_layer_count}</span>
      <span class="k">sampled_genre</span><span class="v">${m.sampled_genre}</span>
      <span class="k">category</span><span class="v">${cat}</span>
    </div>

    ${renderResultsBlock(c.name)}
  `;
}

function renderResultsBlock(caseName) {
  const r = RESULTS[caseName];
  if (!r) {
    return `
      <h3 class="section-title">Phase 2 — real e2e artifacts</h3>
      <div class="placeholder">
        <strong>Not yet run for this case.</strong><br>
        Run via 07_run_storytelling.py then 08_build_results_manifest.py to populate.
      </div>`;
  }
  const s = r.execution_summary;
  const stepRows = s.step_statuses.map((e, i) => {
    const ok = e.status === "COMPLETED";
    const color = ok ? "var(--good)" : (e.status ? "var(--bad)" : "var(--muted)");
    return `<tr>
      <td style="padding:4px 10px;color:var(--muted)">${String(i+1).padStart(2,"0")}</td>
      <td style="padding:4px 10px;font-family:ui-monospace,monospace">${escapeHtml(e.agent_id || "")}</td>
      <td style="padding:4px 10px;color:${color}">${escapeHtml(e.status || "")}</td>
      <td style="padding:4px 10px;color:var(--muted);text-align:right">${(e.elapsed_sec||0).toFixed(1)}s</td>
    </tr>`;
  }).join("");

  const segGrid = (r.illustration_segments||[]).map(p => `
    <a href="./${p}" target="_blank">
      <img src="./${p}" loading="lazy"
           style="width:100%;border-radius:4px;border:1px solid var(--border);display:block;" />
    </a>`).join("");

  const anchorGrid = (r.character_anchors||[]).map(p => {
    const m = p.match(/illustration_anchor_(\w+)\.png/);
    const charId = m ? m[1] : "?";
    return `
      <div style="text-align:center">
        <a href="./${p}" target="_blank">
          <img src="./${p}" loading="lazy"
               style="width:100%;border-radius:4px;border:1px solid var(--border);display:block;" />
        </a>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:ui-monospace,monospace">${escapeHtml(charId)}</div>
      </div>`;
  }).join("");

  const audioRow = (label, path) => path ? `
    <div style="display:flex;align-items:center;gap:10px;padding:6px 0">
      <span style="min-width:90px;color:var(--muted);font-size:12px">${label}</span>
      <audio controls preload="none" style="flex:1;height:32px"><source src="./${path}"></audio>
      <a href="./${path}" download style="font-size:11px;color:var(--accent)">↓</a>
    </div>` : "";

  return `
    <h3 class="section-title">Phase 2 — execution status (${s.completed}/${s.total} ${s.all_pass ? "✓" : "—"})</h3>
    <table style="border-collapse:collapse;font-size:13px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden">
      <tbody>${stepRows}</tbody>
    </table>

    ${r.final_mp4 ? `
    <h3 class="section-title">Final mp4</h3>
    <video controls preload="metadata"
           style="max-width:100%;max-height:480px;border-radius:6px;border:1px solid var(--border);background:#000;display:block">
      <source src="./${r.final_mp4}" type="video/mp4">
    </video>
    <div style="margin-top:6px;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace">
      <a href="./${r.final_mp4}" download style="color:var(--accent)">↓ download</a> · ${escapeHtml(r.final_mp4)}
    </div>
    ` : ""}

    ${anchorGrid ? `
    <h3 class="section-title">Character anchors (debug audit, ${r.character_anchors.length})</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
      ${anchorGrid}
    </div>
    ` : ""}

    ${segGrid ? `
    <h3 class="section-title">Illustration sequence (${r.illustration_segments.length} segments)</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">
      ${segGrid}
    </div>
    ` : ""}

    <h3 class="section-title">Audio tracks</h3>
    <div>
      ${audioRow("narrator", r.narrator_wav)}
      ${audioRow("music", r.music_wav)}
      ${audioRow("ambience", r.ambience_wav)}
      ${audioRow("final mix", r.audio_final)}
    </div>
  `;
}

function render() {
  renderCats();
  renderList();
  renderDetail();
}

function goTo(name) { currentName = name; render(); }
function switchCat(cat) {
  currentCat = cat;
  const items = casesIn(cat);
  currentName = items.length ? items[0].name : null;
  render();
}
function step(delta) {
  const items = casesIn(currentCat);
  if (!items.length) return;
  const idx = Math.max(0, items.findIndex(c => c.name === currentName));
  const next = (idx + delta + items.length) % items.length;
  currentName = items[next].name; render();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key === "1") switchCat("cr");
  else if (e.key === "2") switchCat("intake_img");
  else if (e.key === "3") switchCat("storytelling");
});

(async function init() {
  try {
    const resp = await fetch("./selection.json", { cache: "no-cache" });
    DATA = await resp.json();
  } catch (e) {
    document.getElementById("detail").innerHTML =
      `<div class="placeholder">Failed to load <code>selection.json</code>: ${escapeHtml(e.message)}<br>` +
      `Run via <code>python -m http.server</code> from this directory and open via http://localhost:PORT/.</div>`;
    return;
  }
  // Optional: load phase-2 results manifest. Missing or empty manifest is
  // fine — phase-2 panels will fall back to "Not yet run".
  try {
    const resp = await fetch("./results.json", { cache: "no-cache" });
    if (resp.ok) RESULTS = await resp.json();
  } catch (e) { /* manifest not built yet */ }
  const first = casesIn(currentCat)[0];
  if (first) currentName = first.name;
  renderHeader();
  render();
})();
</script>
</body>
</html>
